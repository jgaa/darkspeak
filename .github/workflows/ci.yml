name: build

on:
  push:
  pull_request:

jobs:
  linux-qt6:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        qt: ["6.10.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtshadertools
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev cmake ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  tor-integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tor
      - run: echo "Tor integration job reserved for the Phase 3 loopback suite"
